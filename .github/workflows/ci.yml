name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/snap_interview_test
  CI_AUTH_SECRET: ci-test-secret-key-that-is-at-least-32-characters-long
  CI_BETTER_AUTH_URL: http://localhost:3000

jobs:
  database:
    name: Migrations · Corpus · E2E
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: snap_interview_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d snap_interview_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Cache Hugging Face models
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-models-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Apply migrations
        run: npx prisma migrate deploy
        env:
          DATABASE_URL: ${{ env.TEST_DATABASE_URL }}
          DIRECT_URL: ${{ env.TEST_DATABASE_URL }}

      - name: Ingest question corpus
        run: npm run corpus:ingest
        env:
          DATABASE_URL: ${{ env.TEST_DATABASE_URL }}
          DIRECT_URL: ${{ env.TEST_DATABASE_URL }}
          AUTH_SECRET: ${{ env.CI_AUTH_SECRET }}
          BETTER_AUTH_URL: ${{ env.CI_BETTER_AUTH_URL }}

      - name: Verify corpus retrieval
        run: npm run corpus:verify
        env:
          DATABASE_URL: ${{ env.TEST_DATABASE_URL }}
          DIRECT_URL: ${{ env.TEST_DATABASE_URL }}
          AUTH_SECRET: ${{ env.CI_AUTH_SECRET }}
          BETTER_AUTH_URL: ${{ env.CI_BETTER_AUTH_URL }}

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: E2E smoke tests
        run: npm run test:e2e
        env:
          E2E_PROTECTED_FLOWS: "1"
          ENABLE_TEST_AUTH: "1"
          DATABASE_URL: ${{ env.TEST_DATABASE_URL }}
          DIRECT_URL: ${{ env.TEST_DATABASE_URL }}
          AUTH_SECRET: ${{ env.CI_AUTH_SECRET }}
          BETTER_AUTH_URL: http://127.0.0.1:3000
          GOOGLE_CLIENT_ID: ci-dummy-client
          GOOGLE_CLIENT_SECRET: ci-dummy-secret
          GROQ_API_KEY: ci-dummy-groq-key
          AWS_REGION: us-east-1
          AWS_ACCESS_KEY_ID: ci-dummy-access-key
          AWS_SECRET_ACCESS_KEY: ci-dummy-secret-key
          S3_BUCKET_NAME: ci-dummy-bucket

  ci:
    name: Lint · Typecheck · Test · Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Security audit
        run: npm audit

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build
        env:
          # Required at build time (Next.js static analysis / server component compilation)
          DATABASE_URL: postgresql://placeholder:placeholder@localhost:5432/placeholder
          AUTH_SECRET: ci-test-secret-key-that-is-at-least-32-characters-long
          BETTER_AUTH_URL: http://localhost:3000
          GOOGLE_CLIENT_ID: placeholder
          GOOGLE_CLIENT_SECRET: placeholder
          GROQ_API_KEY: placeholder
          AWS_REGION: us-east-1
          AWS_ACCESS_KEY_ID: placeholder
          AWS_SECRET_ACCESS_KEY: placeholder
          S3_BUCKET_NAME: placeholder
